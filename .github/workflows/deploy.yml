name: deploy

# Auto-deploy to Render on push to main — but only once the code is proven.
#
# What this is, and why it is not just "Render auto-deploy"
# --------------------------------------------------------
# Render can already redeploy on every push to main on its own. This exists to
# put a gate in front of that: the `verify` job below runs the typecheck and
# the full test suite against a real Postgres, exactly as CI does, and the
# deploy is triggered only if that passes. A red build never reaches
# production. Turn OFF Render's native auto-deploy so this is the only path —
# render.yaml declares `autoDeploy: false` for that reason; if the service was
# created before that line existed, also set Settings -> Auto-Deploy: No in the
# Render dashboard, or the two will race and Render's ungated deploy wins.
#
# The verify job deliberately mirrors ci.yml's typecheck + test rather than
# waiting on the ci workflow: ci also runs the smoke suite, whose payment-hold
# race is timing-dependent, and gating every production deploy on a flaky check
# is how deploys quietly stop happening. ci.yml still runs smoke for
# visibility; the deploy gate is the deterministic part.
#
# Secrets (repo -> Settings -> Secrets and variables -> Actions):
#   RENDER_DEPLOY_HOOK_URL  (required)  Render -> your service -> Settings ->
#                            Deploy Hook. A URL like
#                            https://api.render.com/deploy/srv-XXXX?key=YYYY.
#                            It is a capability on its own, so it lives in
#                            Actions secrets and never in the repo.
#   DATABASE_URL            (optional but recommended)  the production Postgres
#                            URL. When set, migrations are applied before the
#                            deploy is triggered. The migrations are additive
#                            and idempotent, and backward-compatible with the
#                            version currently serving, so applying them ahead
#                            of the new release is safe and is what keeps the
#                            database from lagging the code (011, 012, ...).
#                            When unset, this step is skipped and you must run
#                            `node scripts/migrate.ts` against production
#                            yourself after the deploy.
#   RENDER_APP_URL          (optional)  e.g. https://hasino.onrender.com. When
#                            set, the job polls /healthz after triggering, so a
#                            deploy that builds but never comes up fails the
#                            workflow instead of passing silently.

on:
  push:
    branches: [main]
  # A manual "Run workflow" button, to redeploy the current main without a new
  # commit — e.g. after rotating a secret in the Render dashboard.
  workflow_dispatch:

# One deploy at a time. Not cancel-in-progress: a half-finished deploy is not
# something to interrupt, so a newer push waits its turn rather than aborting
# the release that is already going out.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    # The same real Postgres CI uses: the tests that matter most need one, and
    # a green run that skipped them would be worse than no gate at all.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hasino_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hasino_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hasino_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: schema
        run: psql -v ON_ERROR_STOP=1 -d "$DATABASE_URL" -f db/schema.sql
      - name: migrate
        run: node scripts/migrate.ts
      - name: test
        run: npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    # secrets cannot be read in `if:` directly, so surface their presence as
    # env booleans the steps below can branch on.
    env:
      HAS_DB_URL: ${{ secrets.DATABASE_URL != '' }}
      HAS_APP_URL: ${{ secrets.RENDER_APP_URL != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Require the deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set. Add it from"
            echo "::error::Render -> your service -> Settings -> Deploy Hook,"
            echo "::error::then re-run this workflow."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: env.HAS_DB_URL == 'true'
        with:
          node-version: '22.x'
          cache: npm

      - name: Apply database migrations to production
        if: env.HAS_DB_URL == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Additive and idempotent, and safe against the currently-running
          # version — so applying them before the new build is released keeps
          # the database from ever lagging the code. A no-op when up to date.
          npm ci --omit=dev
          node scripts/migrate.ts
          node scripts/migrate.ts --status

      - name: Warn when migrations are not automated
        if: env.HAS_DB_URL != 'true'
        run: |
          echo "::warning::DATABASE_URL secret is not set, so migrations were"
          echo "::warning::not applied. If this push added or changed a"
          echo "::warning::migration, run 'node scripts/migrate.ts' against"
          echo "::warning::production before trusting the deploy."

      - name: Trigger the Render deploy
        run: |
          echo "Triggering Render deploy for ${GITHUB_SHA::7}..."
          code=$(curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" -o /dev/null -w '%{http_code}')
          echo "Render deploy hook responded $code."

      - name: Wait for the new version to come up
        if: env.HAS_APP_URL == 'true'
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          # /healthz makes no database call, so a 200 means the process is
          # serving. Free-tier build + cold start can take a few minutes, so
          # this polls for up to ~8 minutes before giving up.
          echo "Polling ${RENDER_APP_URL%/}/healthz ..."
          for i in $(seq 1 48); do
            code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "${RENDER_APP_URL%/}/healthz" || echo 000)
            echo "  attempt $i/48: $code"
            if [ "$code" = "200" ]; then
              echo "Service is up."
              exit 0
            fi
            sleep 10
          done
          echo "::error::${RENDER_APP_URL%/}/healthz did not return 200 within the timeout."
          echo "::error::Check the deploy logs in the Render dashboard."
          exit 1
