# Hasino on Render's free tier, for testing.
#
# Runs the same Dockerfile as everything else: no build step, no dist/, Node
# runs the TypeScript directly. Nothing about the application changes to be
# deployed.
#
# Why Render and not the fly.toml sitting next to this file: Fly refuses to
# create an app without a card on file. Render's free web service needs none.
# The trade is that a free service SLEEPS after ~15 minutes with no requests
# and cold-starts in roughly 30-60s on the next one. Two consequences worth
# knowing before you trust anything you see here:
#
#   1. The first request after an idle period is slow. That is the platform,
#      not the app.
#   2. The background workers run INSIDE this process (startWorkers in
#      src/http/server.ts). While the service is asleep the hold sweeper, the
#      refund worker and the notification sender are not running: abandoned
#      checkouts keep holding a chair and queued mail waits. They catch up on
#      the next wake, because each sweeps by timestamp rather than by tick.
#      Fine for testing an app nobody is booking through yet; not fine for a
#      real pilot. That is the thing a paid instance buys.
#
# Database is Neon's free Postgres, not a Render one — Render's free database
# is deleted after 30 days. DATABASE_URL is set by hand in the dashboard.
services:
  - type: web
    name: hasino
    runtime: docker
    plan: free
    # Closest Render region to the Haryana pilot. Free plans cannot deploy to
    # a region that already holds a service in another region, so if you get a
    # region error this is the line to change.
    region: singapore
    # main, now that the work has merged there. Stated rather than left unset:
    # Render falls back to the repo's default branch, which is main today and
    # is one settings change away from not being — and a deploy that silently
    # follows a renamed default is the kind of thing nobody looks at until the
    # wrong tree is live.
    branch: main
    # The deploy is gated by .github/workflows/deploy.yml, which runs
    # the typecheck and the full test suite first and then triggers a
    # deploy hook. Render's own auto-deploy would fire on the raw push,
    # ahead of that gate, which is the ungated build the workflow
    # exists to prevent — so it is turned off here.
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    # No database call, so a Neon blip does not get the service restarted in a
    # loop. /readyz is the one that checks the DB.
    healthCheckPath: /healthz
    envVars:
      # PORT is deliberately absent: Render injects its own and src/main.ts
      # reads it. Pinning it here is how you get a service that builds, boots,
      # and is never routed to.
      - key: NODE_ENV
        value: production
      # Behind Render's proxy, so X-Forwarded-For is the only way to tell
      # callers apart. Without this every request looks like it came from the
      # proxy and one abusive client would rate-limit everybody. Safe here
      # precisely *because* there is a proxy — src/http/middleware.ts takes the
      # last entry, the one the proxy appended, which a caller cannot forge.
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_FORMAT
        value: json
      # No payment provider chosen yet. Bookings are taken and hold a real
      # chair, the completion OTP still gates service, and no money moves.
      - key: PAYMENTS_PROVIDER
        value: none
      # Apply outstanding migrations before this process starts serving.
      #
      # Nothing else in the deploy path does. The Dockerfile goes straight to
      # `node src/main.ts`; Render's pre-deploy command is a paid feature; and
      # the GitHub workflow only migrates when a DATABASE_URL secret is set,
      # which is optional and, unset, degrades to a warning. Without this the
      # schema advanced only when somebody ran the script by hand, and the code
      # here has already shipped ahead of it once.
      #
      # Safe to leave on: scripts/migrate.ts is idempotent, holds a Postgres
      # advisory lock so a restart or a second container cannot double-apply,
      # and runs each file in a transaction. A failed migration exits before
      # listening, so the health check fails and the PREVIOUS version keeps
      # serving — nothing goes down, the release simply does not happen.
      #
      # Set on this service only. The admin panel shares the database, and one
      # owner for the schema is clearer than two racing for the same lock.
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "true"
      # sync: false means "Render must not invent a value and must not carry
      # one over from a template" — you type these once in the dashboard, and
      # they are never written into this file or into git.
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Android App Links. Without these two the server 404s
      # /.well-known/assetlinks.json, Android cannot verify that this site and
      # the Hasino app are the same publisher, and the OAuth return therefore
      # stays in the browser — the user signs in in Chrome while the app they
      # started from is still signed out. That is the whole bug; the APK has
      # claimed these links since the first Android build.
      #
      # ANDROID_CERT_FINGERPRINTS is the SHA-256 of the certificate the APK
      # was signed with, uppercase hex with colons, comma-separated when there
      # is more than one. A debug APK and a release APK have different
      # certificates: list both while you are sideloading debug builds, or the
      # build on the phone is not the build the site vouches for.
      #
      #   apksigner verify --print-certs app-debug.apk
      #
      # Not hardcoded here because it is per keystore, and a wrong value fails
      # closed rather than loudly — links quietly open in the browser again.
      - key: ANDROID_CERT_FINGERPRINTS
        sync: false
      - key: ANDROID_PACKAGE
        value: com.hasino.app

  # ------------------------------------------------------------------ admin
  # The admin panel, hosted. Same repo, same image, different process: the
  # Dockerfile's CMD runs src/main.ts and dockerCommand overrides it with
  # src/admin-main.ts. Nothing about the service above changes — it has no
  # admin route, no admin asset and no /api/admin/* to expose, which is why
  # hosting this one is additive rather than a widening of that one.
  #
  # This panel is on the internet. On loopback the operating system refused
  # every connection from another machine and Clerk was the second lock; here
  # Clerk and ADMIN_EMAILS are the only locks. Every /api/admin/* route runs
  # requireRole(s,'admin') against a verified token — that was always true, and
  # it is now the entire perimeter. startAdmin() refuses to boot public with
  # any part of it missing rather than coming up half-locked.
  #
  # Consequences worth knowing:
  #   - Anyone on the internet can reach the sign-in page. They get an admin
  #     session only by holding a Google account whose VERIFIED address is in
  #     ADMIN_EMAILS. Treat that variable as the credential it now is, and
  #     protect those Google accounts with 2FA.
  #   - Two free services sleep independently. Approving a salon after a quiet
  #     spell waits on this one waking, not the customer app.
  #   - Free instance hours are pooled per account, so two services draw from
  #     one budget. Both sleeping is what keeps that affordable.
  - type: web
    name: hasino-admin
    runtime: docker
    plan: free
    region: singapore
    # Same branch as the customer service above, deliberately: the two share a
    # database and a schema, so a panel running an older tree than the app it
    # administers is a migration mismatch waiting to happen.
    branch: main
    # The deploy is gated by .github/workflows/deploy.yml, which runs
    # the typecheck and the full test suite first and then triggers a
    # deploy hook. Render's own auto-deploy would fire on the raw push,
    # ahead of that gate, which is the ungated build the workflow
    # exists to prevent — so it is turned off here.
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    # The one line that makes this the admin panel instead of a second copy of
    # the customer app.
    dockerCommand: node src/admin-main.ts
    # The panel has no /healthz — it is not the customer app. /api/config is
    # the equivalent: served without auth, touches no database, and returns the
    # publishable key the page boots clerk-js with.
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      # The deliberate opt-in. Without it this process binds 127.0.0.1 inside
      # the container, Render's proxy cannot reach it, and every request 502s.
      # With it, HOST defaults to 0.0.0.0 — there is no ADMIN_HOST to set.
      - key: ADMIN_PUBLIC
        value: "true"
      # Behind Render's proxy: without this the rate limiter sees one client
      # (the proxy) and one caller would lock out every operator.
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_FORMAT
        value: json
      # PORT and ADMIN_PORT are both deliberately absent. Render injects PORT
      # and the panel reads it; setting ADMIN_PORT would pin the process to
      # 4000, which Render does not route to.
      #
      # Same four values as the service above, and DATABASE_URL must be the
      # same Neon database — an approval here is visible to the customer app
      # immediately because it is the same row, not a copy.
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # No longer just configuration: this is the list of people who can
      # administer Hasino from anywhere on the internet.
      - key: ADMIN_EMAILS
        sync: false
