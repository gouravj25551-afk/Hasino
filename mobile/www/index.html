<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hasino</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; text-align:center;
         background:#0b0a0f; color:#edecf3;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px; }
  .mark { display:inline-block; background:#a78bfa; color:#fff; font-weight:800; font-size:28px;
          letter-spacing:-.02em; padding:10px 20px; border-radius:14px; }
  p { color:#9a97a8; line-height:1.5; max-width:32ch; }
</style>
</head>
<body>
  <div>
    <div class="mark">hasino</div>
    <!-- Shown only when the device cannot reach the deployed site. The app
         itself is the live web app, loaded from server.url — see
         capacitor.config.ts. This file is the offline fallback, not the app. -->
    <p>Can’t reach Hasino right now. Check your connection and reopen the app.</p>
  </div>
</body>
</html>
